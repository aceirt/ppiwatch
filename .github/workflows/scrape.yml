# PPI Property Watch — Live Scraper & Feed
# ---------------------------------------------------------------------------
# Drop this file into your GitHub Pages repo (aceirt/ppiwatch) at:
#   .github/workflows/scrape.yml
# alongside scrape-live.ts, curated.json, and feed.json (all at the repo root).
#
# It runs the live scraper on a schedule and auto-commits the refreshed
# feed.json, so https://aceirt.github.io/ppiwatch/feed.json stays live with
# zero upkeep. The scraper pulls the REAL public auction calendar from each
# realforeclose.com county portal and merges it with the curated inventory.
#
# All actions pinned to versions that natively run on Node 24 (Node 20 was
# deprecated on GitHub Actions runners as of 2025-09-19). No Python step —
# the scraper is pure TypeScript (Bun), so setup-python is not needed.
# ---------------------------------------------------------------------------
name: Scrape & publish feed

on:
  schedule:
    # Every 2 hours — new auction dates appear in the app within ~60s of each run.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scrape live sources
        env:
          REALFORECLOSE_USER: ${{ secrets.REALFORECLOSE_USER }}
          REALFORECLOSE_PASS: ${{ secrets.REALFORECLOSE_PASS }}
        run: bun scrape-live.ts

      - name: Upload feed artifact
        uses: actions/upload-artifact@v5
        with:
          name: feed-json
          path: feed.json
          retention-days: 1

      - name: Commit refreshed feed.json
        run: |
          git config user.name "ppi-scraper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "No changes — feed.json already current."
            exit 0
          fi
          git commit -m "chore: refresh feed.json [skip ci]"
          git push

  # Deploy feed.json to GitHub Pages
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@v5
        with:
          name: feed-json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed.json

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
